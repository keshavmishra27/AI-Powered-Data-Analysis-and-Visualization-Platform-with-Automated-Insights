{% extends 'base.html' %}
{% block title %}Upload Dataset{% endblock %}
{% block content %}
<div class="container mt-5">
    <h2>1. Upload Dataset & Goal Identification</h2>
    <div class="card bg-dark mt-3">
        <div class="card-body">
            <form action="{{ url_for('app_blueprint.upload_page') }}" method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Select Dataset (CSV/Excel)</label>
                    <input class="form-control" type="file" name="file" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Goal Identification</label>
                    <select name="goal" class="form-select" id="goalSelect">
                        <option value="clean">Clean Dataset Only</option>
                        <option value="predict">Predict Target (ML Benchmark)</option>
                    </select>
                </div>

                <div class="mb-3" id="targetColGroup" style="display: none;">
                    <label class="form-label">Target Column Name (if predicting)</label>
                    <input class="form-control" type="text" name="target_col" placeholder="e.g. Salary, Churn">
                </div>

                <button type="submit" class="btn btn-primary mt-3">Start Agentic Pipeline</button>
            </form>
        </div>
    </div>
</div>

<script>
document.getElementById('goalSelect').addEventListener('change', function() {
    if (this.value === 'predict') {
        document.getElementById('targetColGroup').style.display = 'block';
    } else {
        document.getElementById('targetColGroup').style.display = 'none';
    }
});
</script>
{% endblock %}
